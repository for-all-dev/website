name: Check

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Check out the PR branch itself (not the detached merge commit) so the
          # lockfile sync below has somewhere to push.
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # Dependabot bumps package.json but leaves bun.lock untouched, which makes
      # --frozen-lockfile fail here and would break deploy.yml after merge.
      # Regenerate the lockfile and push it back onto the PR branch.
      - name: Sync bun.lock
        if: github.actor == 'dependabot[bot]'
        run: |
          bun install --lockfile-only
          if ! git diff --quiet -- bun.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: sync bun.lock' -- bun.lock
            git push
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc -b

      - name: Build
        run: bunx vite build
